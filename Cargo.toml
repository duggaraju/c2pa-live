[package]
name = "c2pa-live"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
c2pa = { version = "0.91.11", features = ["file_io", "rust_native_crypto"] }
c2pa_cbor = "0.78.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
coset = "0.4.2"
ed25519-dalek = "3.0.0"
essi-ffmpeg = "0.3.0"
getrandom = "0.4.3"
http-body-util = "0.1.5"
http-body = "1.1"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["server", "tokio", "http1"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
http = "1.5.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
