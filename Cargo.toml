[package]
name = "c2pa-live"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1.7"
c2pa = { version = "0.89.0", features = ["file_io", "rust_native_crypto"] }
clap = { version = "4.5", features = ["derive"] }
essi-ffmpeg = "0.3.0"
http-body-util = "0.1"
http-body = "1.0"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
http = "1.4.2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
